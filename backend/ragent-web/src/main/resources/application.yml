server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ragent
  # 激活 local profile，读取 gitignored 的 application-local.yml（存放 DeepSeek API Key）
  profiles:
    active: local
  # AI 对话模型：OpenAI starter 对接 DeepSeek（OpenAI 兼容协议）
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
      # 向量模型走阿里百炼 DashScope（OpenAI 兼容协议），独立 key + base-url
      # 注意：base-url 不带 /v1，Spring AI 会拼上默认路径 /v1/embeddings
      embedding:
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        options:
          model: text-embedding-v3
    # 向量库 Qdrant（注意：Spring AI 走 gRPC，端口是 6334 而非 REST 的 6333）
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: ragent_docs
        initialize-schema: true
  datasource:
    url: jdbc:mysql://localhost:3306/ragent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 数据库未就绪时不阻断应用启动，由 /health 反映真实状态
      initialization-fail-timeout: -1
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 雪花 ID
      id-type: assign_id

# Sa-Token 认证（P1 启用，P0 仅注册依赖不拦截）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  is-log: false

logging:
  level:
    com.ragent: debug
