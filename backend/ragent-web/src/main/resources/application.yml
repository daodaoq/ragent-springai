server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    # Tomcat 10.1 新默认 multipart 部件数上限为 10（max-part-count=10），批量上传多个文件会直接 400。
    # 放宽到 1000，配合上方的 multipart 请求体上限，支撑一次传几十个文档。
    max-part-count: 1000

spring:
  application:
    name: ragent
  # 激活 local profile，读取 gitignored 的 application-local.yml（存放 DeepSeek API Key）
  profiles:
    active: local
  # AI 对话模型：OpenAI starter 对接 DeepSeek（OpenAI 兼容协议）
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
      # 向量模型走阿里百炼 DashScope（OpenAI 兼容协议），独立 key + base-url
      # 注意：base-url 不带 /v1，Spring AI 会拼上默认路径 /v1/embeddings
      embedding:
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        options:
          model: text-embedding-v3
    # 向量库 Qdrant（注意：Spring AI 走 gRPC，端口是 6334 而非 REST 的 6333）
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: ragent_docs
        initialize-schema: true
  datasource:
    url: jdbc:mysql://localhost:3306/ragent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 数据库未就绪时不阻断应用启动，由 /health 反映真实状态
      initialization-fail-timeout: -1
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
  servlet:
    multipart:
      # 单文件上限与服务端 MAX_FILE_SIZE 一致；整批上限放宽，支持批量上传多文档（否则批量传几个大文件就触发请求体超限）
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 雪花 ID
      id-type: assign_id

# Sa-Token 认证（P1 启用，P0 仅注册依赖不拦截）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  is-log: false

# 分片配置（结构感知分片器）
ragent:
  chunking:
    max-chunk-chars: 800
    overlap-chars: 100
    # 语义分片：长且无标题的小节按段落 embedding 相似度断片（默认关闭，开启后上传/重切会多调一次嵌入）
    semantic-enabled: false
    semantic-threshold: 0.5
    semantic-min-blocks: 3
  # P4 检索配置（混合检索 + 重排）
  retrieval:
    # 向量/关键词各自召回候选数
    dense-top-n: 20
    keyword-top-n: 20
    # 最终返回条数（也作为重排 top_n）
    top-k: 5
    # RRF 融合常数
    rrf-k: 60
    # 关键词通道开关（FULLTEXT 索引未建时可关）
    keyword-enabled: true
    # 重排开关
    rerank-enabled: true
    # 送入重排的候选数
    rerank-top-n: 10
    rerank-model: gte-rerank-v2
    # 复用百炼向量 Key（gitignored application-local.yml 中 spring.ai.openai.embedding.api-key）
    rerank-api-key: ${spring.ai.openai.embedding.api-key:}
    # P6 查询处理管线（A-G 各阶段的启停/顺序在 DB kb_query_stage，前端编排页可改）
    query-processing-enabled: true   # 主开关：false 只做 A 规范化 + 原样检索
    multi-query-count: 3            # D 多查询变体数量
    context-turn-count: 3           # F 喂给改写的最近用户轮数
    query-log-enabled: true         # 查询日志采集（每次 RAG 请求后台异步落库 rag_query_log）
  # 模型调用分布式队列限流（Redis ZSET 公平排队 + Lua 原子 + Pub/Sub 通知 + SSE 位次反馈）
  ratelimit:
    enabled: true                   # 总开关
    capacity: 4                     # 并发处理中的模型请求上限，超过则进队列
    queue-capacity: 50              # 队列长度上限，满则直接拒绝
    wait-timeout-seconds: 30        # 排队最大等待，超时拒绝
    queue-key: "model:chat"         # 全局队列 key
    notify-channel: "rlim:notify"   # Pub/Sub 通知频道
    sweep-interval-ms: 3000         # 兜底推进扫描间隔
  # 模型熔断降级（三态熔断器 + 候选模型切换 + 流式首包探测）
  model:
    fallback-models:                # 主模型失败时按序尝试的候选（同一 key/base-url，仅模型名不同）
      - deepseek-chat
    failure-threshold: 2            # 连续失败 N 次熔断打开
    open-duration-ms: 30000         # 熔断打开时长
    half-open-max-calls: 1          # HALF_OPEN 放行试调用数（1 次成功即恢复）
    first-token-timeout-ms: 8000    # 流式首包超时
  # 会话记忆：滑动窗口 + LLM 摘要压缩（溢出压缩，Redis + MySQL 双持久化）
  memory:
    window-size: 12                 # 滑动窗口条数，超过即压缩最旧部分
    summary-enabled: true           # 摘要压缩开关
    summary-max-chars: 1500         # 摘要长度上限（控制 Token 成本）

logging:
  level:
    com.ragent: debug

# MinIO 对象存储（默认凭据 minioadmin/minioadmin 仅限内网；生产请用环境变量覆盖）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:ragent}
  # 图片直链有效期（秒），默认 7 天
  url-expiry: 604800
