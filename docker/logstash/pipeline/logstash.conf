# Logstash 管道：接收 logback TCP JSON 日志 → 写入 Elasticsearch
# 日志索引按月分片：ragent-logs-2026.08
# 启用前提：后端以 --spring.profiles.active=local,elk 启动，日志才会发往本管道

input {
  tcp {
    port => 5000
    codec => json_lines
    type => "ragent-app"
  }
}

filter {
  # 解析 logback 写入的 ISO-8601 @timestamp
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # 保留 logback 原始级别大小写（INFO/WARN/ERROR/DEBUG），与后端日志查询的 level 筛选保持一致

  # 无 level 时默认 INFO
  if ![level] {
    mutate { add_field => { "level" => "INFO" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ragent-logs-%{+YYYY.MM}"
  }
  # 同时输出到控制台（调试用）
  stdout {
    codec => rubydebug
  }
}
