# 人工智能实验室在线问答系统 - 中间件环境
# 使用: docker compose up -d
services:
  # ===================== 业务数据库 =====================
  mysql:
    image: mysql:8.4
    container_name: ragent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ragent
    # 已停用本地 MySQL，容器直接用宿主机 3306
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ===================== 缓存 =====================
  redis:
    image: redis:7-alpine
    container_name: ragent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== 文件/附件存储 =====================
  minio:
    image: minio/minio
    container_name: ragent-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  # ===================== 向量库（RAG 核心） =====================
  # Qdrant：轻量向量库，Spring AI 原生支持（Milvus 镜像国内源拉不到，已切换）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mysql-data:
  redis-data:
  minio-data:
  qdrant-data:
